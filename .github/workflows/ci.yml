name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e '.[dev]'
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type-check
        run: mypy
      - name: Test
        run: pytest --cov --cov-report=term-missing
      - name: Eval set (static pre-pass)
        run: codelens eval --static-only | tee -a "$GITHUB_STEP_SUMMARY"

  action:
    # Runs the composite action from this checkout on a fixture diff, so action.yml is tested on every push.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - id: codelens
        uses: ./
        with:
          diff-file: tests/fixtures/git_extended_headers.diff
      - name: Check outputs
        env:
          FILES: ${{ steps.codelens.outputs.files }}
          DIFF: ${{ steps.codelens.outputs.diff-file }}
          FINDINGS: ${{ steps.codelens.outputs.findings }}
        run: |
          test "$FILES" = "8" || { echo "expected 8 files, got '$FILES'"; exit 1; }
          test "$DIFF" = "tests/fixtures/git_extended_headers.diff"
          # No provider configured: the review step is skipped with a notice, not failed.
          test "$FINDINGS" = "0" || { echo "expected a skipped review, got '$FINDINGS' findings"; exit 1; }

  action-review:
    # A full review through the action: the sample PR replayed from its hand-written recording, no key needed.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - id: codelens
        uses: ./
        with:
          diff-file: tests/fixtures/sample_pr.diff
          recordings: tests/fixtures/recordings
      - name: Check outputs
        env:
          FINDINGS: ${{ steps.codelens.outputs.findings }}
          REJECTED: ${{ steps.codelens.outputs.rejected }}
        run: |
          test "$FINDINGS" = "3" || { echo "expected 3 findings, got '$FINDINGS'"; exit 1; }
          test "$REJECTED" = "1" || { echo "expected 1 rejected finding, got '$REJECTED'"; exit 1; }
      - id: capped
        uses: ./
        with:
          diff-file: tests/fixtures/sample_pr.diff
          recordings: tests/fixtures/recordings
          max-findings: "1"
      - name: Check the cap
        env:
          FINDINGS: ${{ steps.capped.outputs.findings }}
        run: test "$FINDINGS" = "1" || { echo "expected 1 finding under max-findings 1, got '$FINDINGS'"; exit 1; }

  action-static:
    # The static pre-pass through the action: an eval case reviewed from its after/ tree, with a
    # hand-written answer keyed on the prompt that includes the static block (so ruff on Linux must
    # produce exactly what it produces locally, or the recording misses and the job fails).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - id: codelens
        uses: ./
        with:
          diff-file: evals/cases/discount-codes/pr.diff
          source-root: evals/cases/discount-codes/after
          recordings: tests/fixtures/eval-recordings
      - name: Check outputs
        env:
          FINDINGS: ${{ steps.codelens.outputs.findings }}
          STATIC: ${{ steps.codelens.outputs.static }}
        run: |
          test "$FINDINGS" = "2" || { echo "expected 2 findings, got '$FINDINGS'"; exit 1; }
          test "$STATIC" = "1" || { echo "expected 1 static finding, got '$STATIC'"; exit 1; }
      - id: off
        uses: ./
        with:
          diff-file: evals/cases/discount-codes/pr.diff
          source-root: evals/cases/discount-codes/after
          recordings: tests/fixtures/eval-recordings
          static: "false"
        continue-on-error: true
      - name: Check that turning the pre-pass off changes the prompt
        env:
          OUTCOME: ${{ steps.off.outcome }}
        # No static block means a different prompt, which was never recorded: the review must fail loudly.
        run: test "$OUTCOME" = "failure" || { echo "expected a recording miss, got '$OUTCOME'"; exit 1; }

  action-pr:
    # On pull requests, the action fetches the PR's own diff through the API.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./
