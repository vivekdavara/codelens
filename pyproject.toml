[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "codelens"
version = "0.1.0"
description = "LLM pull-request reviewer and test generator, packaged as a GitHub Action."
readme = "README.md"
license = "MIT"
authors = [{ name = "Vivek Davara" }]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# The static pre-pass's findings are part of the prompt, and so of every recording key: pin the ruff it runs.
static = ["ruff==0.16.10"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff==0.16.10", "mypy>=1.10"]

[project.scripts]
codelens = "codelens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["codelens"]
branch = true

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Diff fixtures need trailing whitespace on context lines.
"tests/**" = ["W291", "W293"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
