name: CodeLens
description: LLM pull-request reviewer and test generator (recorded provider by default; live LLM opt-in).
author: Vivek Davara
branding:
  icon: eye
  color: blue

# The action fetches the pull request's diff, summarises its reviewable lines, reviews it with the chosen
# provider, writes the review to the job summary and, on a pull request, posts it as one review. Test
# generation (day 4) builds on the same steps.
#
# Security: every ${{ }} value reaches the shell through env, never interpolated into a script, so a branch
# name or input can't inject commands. Run this on `pull_request`, not `pull_request_target`: secrets are
# then never exposed to code from forks, and on a fork's PR (no secrets) the review is skipped, not failed.

inputs:
  github-token:
    description: Token used to read the pull request diff and post the review (needs pull-requests write).
    default: ${{ github.token }}
  diff-file:
    description: Review this diff file instead of fetching the pull request's diff (for local runs and tests).
    default: ""
  provider:
    description: Model provider - recorded (replays saved answers from `recordings`), anthropic or openai.
    default: recorded
  api-key:
    description: API key for a live provider; pass a secret. It reaches CodeLens through env only.
    default: ""
  model:
    description: Model for a live provider (default - claude-opus-5-5 for anthropic, gpt-5 for openai).
    default: ""
  recordings:
    description: Directory of recorded answers, for the recorded provider.
    default: ""
  post:
    description: On a pull request, post the review ("true") or only write it to the job summary ("false").
    default: "true"
  max-findings:
    description: Most findings one review posts (the worst first).
    default: "10"
  max-prompt-chars:
    description: Characters of diff shown to the model; code gets them first, then tests, then docs.
    default: "200000"
  python-version:
    description: Python used to run CodeLens.
    default: "3.11"

outputs:
  diff-file:
    description: Path of the diff that was parsed.
    value: ${{ steps.diff.outputs.path }}
  files:
    description: Number of files in the diff.
    value: ${{ steps.summary.outputs.files }}
  findings:
    description: Number of findings in the review (0 when the review was skipped).
    value: ${{ steps.review.outputs.findings }}
  rejected:
    description: Number of model findings dropped because they failed validation or anchoring.
    value: ${{ steps.review.outputs.rejected }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install CodeLens
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --quiet "$ACTION_PATH"

    - name: Get the diff
      id: diff
      shell: bash
      env:
        DIFF_FILE: ${{ inputs.diff-file }}
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        from_pr=false
        moved=false
        if [ -n "$DIFF_FILE" ]; then
          path="$DIFF_FILE"
        elif [ -n "$PR_NUMBER" ]; then
          path="$RUNNER_TEMP/codelens-pr-$PR_NUMBER.diff"
          gh api "repos/$REPO/pulls/$PR_NUMBER" -H "Accept: application/vnd.github.diff" > "$path"
          from_pr=true
          # That diff is of the PR's head when it was fetched. If the head is no longer this event's commit,
          # a newer push happened and its own run reviews it; these line numbers must not be pinned to the
          # old commit. Checked after the fetch, so an unchanged head means the diff is of this commit.
          head=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha)
          if [ "$head" != "$HEAD_SHA" ]; then moved=true; fi
        else
          echo "::error::CodeLens needs a pull_request event or the diff-file input"
          exit 1
        fi
        {
          echo "path=$path"
          echo "from-pr=$from_pr"
          echo "moved=$moved"
        } >> "$GITHUB_OUTPUT"

    - name: Parse and summarise
      id: summary
      shell: bash
      env:
        DIFF_PATH: ${{ steps.diff.outputs.path }}
      run: |
        {
          echo "### CodeLens: reviewable lines"
          echo '```'
          codelens diff "$DIFF_PATH"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        files=$(codelens diff --json "$DIFF_PATH" | python -c 'import json,sys; print(len(json.load(sys.stdin)["files"]))')
        echo "files=$files" >> "$GITHUB_OUTPUT"
        codelens diff "$DIFF_PATH"

    - name: Review
      id: review
      shell: bash
      env:
        DIFF_PATH: ${{ steps.diff.outputs.path }}
        FROM_PR: ${{ steps.diff.outputs.from-pr }}
        MOVED: ${{ steps.diff.outputs.moved }}
        PROVIDER: ${{ inputs.provider }}
        API_KEY: ${{ inputs.api-key }}
        MODEL: ${{ inputs.model }}
        RECORDINGS: ${{ inputs.recordings }}
        POST: ${{ inputs.post }}
        MAX_FINDINGS: ${{ inputs.max-findings }}
        MAX_PROMPT_CHARS: ${{ inputs.max-prompt-chars }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        skip() {
          echo "::notice::CodeLens review skipped: $1"
          echo "findings=0" >> "$GITHUB_OUTPUT"
          echo "rejected=0" >> "$GITHUB_OUTPUT"
          exit 0
        }
        [ "$MOVED" != "true" ] || skip "the pull request moved on to a newer commit, which its own run reviews"
        case "${PROVIDER:-recorded}" in
          recorded)
            [ -n "$RECORDINGS" ] || skip "no provider configured (set provider and api-key, or recordings)"
            export CODELENS_RECORDINGS="$RECORDINGS" ;;
          anthropic)
            [ -n "$API_KEY" ] || skip "no api-key (secrets are not passed to pull requests from forks)"
            export ANTHROPIC_API_KEY="$API_KEY" ;;
          openai)
            [ -n "$API_KEY" ] || skip "no api-key (secrets are not passed to pull requests from forks)"
            export OPENAI_API_KEY="$API_KEY" ;;
          *)
            echo "::error::unknown provider '$PROVIDER' (use recorded, anthropic or openai)"
            exit 1 ;;
        esac
        export CODELENS_PROVIDER="${PROVIDER:-recorded}"
        if [ -n "$MODEL" ]; then export CODELENS_MODEL="$MODEL"; fi
        # An input set to an empty expression (an unset ${{ vars.X }}) arrives as "", not as its default.
        args=(review "$DIFF_PATH" --json
              --max-findings "${MAX_FINDINGS:-10}" --max-prompt-chars "${MAX_PROMPT_CHARS:-200000}")
        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then args+=(--summary-file "$GITHUB_STEP_SUMMARY"); fi
        # Post only a review of the PR's own diff: a diff-file's line numbers are not this PR's.
        if [ "$FROM_PR" = "true" ]; then
          args+=(--commit "$HEAD_SHA")
          if [ "${POST:-true}" = "true" ]; then args+=(--post --pr "$PR_NUMBER"); fi
        elif [ -n "$PR_NUMBER" ] && [ "${POST:-true}" = "true" ]; then
          echo "::notice::CodeLens is not posting: the review is of diff-file, not of this pull request's diff"
        fi
        codelens "${args[@]}" > "$RUNNER_TEMP/codelens-review.json"
        python -c '
        import json, sys
        review = json.load(open(sys.argv[1]))
        print("findings=%d" % len(review["findings"]))
        print("rejected=%d" % len(review["rejections"]))
        ' "$RUNNER_TEMP/codelens-review.json" >> "$GITHUB_OUTPUT"
